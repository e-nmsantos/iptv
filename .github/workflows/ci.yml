name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: iptv_player
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            iptv_player/requirements.txt
            iptv_player/requirements-dev.txt
      - name: Install system runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src config tests
      - name: Compile
        run: python -m compileall -q main.py config src tests
      - name: Test with coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pytest --cov=src --cov=config --cov-fail-under=35
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest

  android:
    name: Android TV
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv_player/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and lint
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-tv-debug
          path: iptv_player/android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  performance:
    name: Catálogo sintético / 100 mil
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv_player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: iptv_player/requirements-dev.txt
      - name: Install runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc
          python -m pip install -r requirements-dev.txt
      - name: Benchmark 100k
        run: python -m benchmarks.catalog_benchmark --sizes 100000 --enforce-budget | tee benchmark-100k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-catalog-100k
          path: iptv_player/benchmark-100k.txt
