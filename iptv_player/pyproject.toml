[project]
name = "iptv-player"
version = "0.5.0"
description = "Desktop IPTV player for authorized M3U, Xtream and Stalker sources"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["packaging"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
